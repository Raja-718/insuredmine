name: Deploy web demo to GitHub Pages

# Deploys the static site in insuredmine-web/ to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:        # allows manual "Run workflow" from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site (insuredmine-web folder)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./insuredmine-web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
